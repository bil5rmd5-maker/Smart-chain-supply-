<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة "استشير" المعتمدة - الذكاء الاصطناعي الهندسي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b132b; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-emerald-500/30 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-black text-white flex items-center gap-2">
                <i class="fa-solid fa-microchip text-emerald-400"></i> منصة "استشير" للتحليل الهندسي المباشر
            </h1>
            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-bold">
                محرك AI حقيقي (Real-Time)
            </span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 sm:p-6">
        
        <!-- API Key Setup (Optional/Stored locally) -->
        <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-xs text-slate-300">
                <span class="font-bold text-emerald-400 block mb-0.5"><i class="fa-solid fa-key ml-1"></i> مفتاح Gemini API:</span>
                ادخل مفتاح API الخاص بك من Google AI Studio لضمان التوليد الذكي غير المحدود.
            </div>
            <input type="password" id="apiKeyInput" placeholder="أدخل مفتاح Gemini API هنا..." class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white w-full sm:w-72 focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Problem Input Form -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl mb-8">
            <label class="block text-sm font-bold text-slate-200 mb-2">وصف التحدي الهندسي / المشكلة التشغيلية:</label>
            <textarea id="userProblem" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition" placeholder="اكتب مشكلتك بدقة هنا... (مثال: نعاني من ارتفاع حرارة المحركات واستهلاك الوقود الزائد في شاحنات النقل اللوجستي...)"></textarea>

            <button onclick="generateAIReport()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl transition shadow-lg flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i> تشغيل محرك التحليل والاستشارة الذكية
            </button>
        </div>

        <!-- Loader -->
        <div id="loading" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent mb-3"></div>
            <p class="text-sm font-bold text-slate-300">جاري تحليل النص وتوليد الحلول الهندسية المخصصة عبر الذكاء الاصطناعي...</p>
        </div>

        <!-- Output Result -->
        <div id="resultCard" class="hidden bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl space-y-6">
            <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
                <h3 class="text-lg font-black text-emerald-400" id="reportTitle">التقرير الاستشاري الهندسي</h3>
                <button onclick="window.print()" class="text-xs bg-slate-800 hover:bg-slate-700 text-white px-3 py-2 rounded-xl border border-slate-700">
                    <i class="fa-solid fa-print ml-1"></i> طباعة / PDF
                </button>
            </div>

            <div id="aiResponseContent" class="text-slate-200 text-sm leading-relaxed space-y-4">
                <!-- AI Output Rendered Here -->
            </div>
        </div>

    </main>

    <script>
        async function generateAIReport() {
            const problem = document.getElementById('userProblem').value.trim();
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            if (!problem) {
                alert('يرجى كتابة نص المشكلة أولاً!');
                return;
            }

            if (!apiKey) {
                alert('يرجى وضع مفتاح Gemini API في الخانة المخصصة بالأعلى لتشغيل محرك الذكاء الاصطناعي الحقيقي!');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');

            const promptText = `
أنت مستشار هندسي خبير في إدارة الاعتمادية وسلاسل الإمداد والتميز التشغيلي.
قم بتحليل المشكلة التالية بدقة واكتب تقريراً هندسياً حقيقياً ومباشراً وبدون تكرار:

المشكلة المدخلة:
"${problem}"

المطلوب تنظيم التقرير في الأقسام التالية بوضوح وبأسلوب هندسي موثوق:
1. **التشخيص المباشر والمسببات الجذرية**: (تحليل دقيق بناءً على ما ذكره المستخدم).
2. **3 حلول هندسية عمليّة ومحددة**: (لكل حل: اسم الحل، آلية التنفيذ الميدانية، والأثر المتوقع).
3. **أبرز المخاطر الميدانية وكيفية الوقاية منها**.
4. **المخرجات الملموسة (Deliverables)**.
5. **خطة العمل التنفيذية (Roadmap)**.
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let text = data.candidates[0].content.parts[0].text;
                    // Convert markdown bold to HTML
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-emerald-400 font-bold">$1</strong>');
                    text = text.replace(/\n/g, '<br>');

                    document.getElementById('aiResponseContent').innerHTML = text;
                    document.getElementById('resultCard').classList.remove('hidden');
                } else {
                    alert('حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من صحة مفتاح API.');
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم. تحقق من الإنترنت ومفتاح API.');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
